name: ONTA MY MONEY - Verificacion Backend Dart

on:
  push:
    branches: [main, feature/offline-first]
  pull_request:
    branches: [main, feature/offline-first]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onta-backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Dart estable
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dependencias
        run: dart pub get
      - name: Analisis Dart
        run: dart analyze
      - name: Pruebas unitarias, SQLite, multidivisa y seguridad
        run: dart test
