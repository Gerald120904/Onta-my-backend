name: Backend CI

on:
  push:
    branches:
      - main
      - feature/offline-first
  pull_request:
    branches:
      - main
      - feature/offline-first

jobs:
  validate:
    name: Lint & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Static Analysis
        run: dart analyze

      - name: Run Test Suite
        run: dart test
